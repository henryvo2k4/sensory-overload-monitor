<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradient nền Squircle -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Gradient mặt trời dịu êm -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Gradient nhịp tim điều hòa -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Đổ bóng nổi khối nhẹ nhàng -->
    <filter id="watchShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0c4a6e" flood-opacity="0.3" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#fde047" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- 1. Nền Squircle dịu êm -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- 2. Quai đeo đồng hồ (Dây đeo silicon mềm mại) -->
  <path d="M 184 32 L 328 32 C 328 32, 324 88, 318 102 L 194 102 C 188 88, 184 32, 184 32 Z" fill="#ffffff" fill-opacity="0.4" />
  <path d="M 194 410 L 318 410 C 324 424, 328 480, 328 480 L 184 480 C 184 480, 188 424, 194 410 Z" fill="#ffffff" fill-opacity="0.4" />

  <!-- 3. Thân đồng hồ (Case trắng sang trọng, bo tròn kiểu Apple Watch/Galaxy Watch) -->
  <rect x="110" y="86" width="292" height="340" rx="76" fill="#ffffff" filter="url(#watchShadow)" />

  <!-- Nút Digital Crown bên sườn đồng hồ -->
  <rect x="402" y="152" width="12" height="48" rx="6" fill="#e2e8f0" />

  <!-- 4. Màn hình đồng hồ (Sky-50 nhẹ nhàng) -->
  <rect x="132" y="108" width="248" height="296" rx="56" fill="#f0f9ff" />

  <!-- 5. Mặt trời Sensory (Ấm áp, dịu êm) -->
  <g filter="url(#glow)">
    <circle cx="256" cy="216" r="48" fill="url(#sunGrad)" />
    <!-- 8 tia nắng bo tròn -->
    <g stroke="url(#sunGrad)" stroke-width="12" stroke-linecap="round">
      <line x1="256" y1="148" x2="256" y2="136" />
      <line x1="256" y1="284" x2="256" y2="296" />
      <line x1="188" y1="216" x2="176" y2="216" />
      <line x1="324" y1="216" x2="336" y2="216" />
      <line x1="208" y1="168" x2="199" y2="159" />
      <line x1="304" y1="264" x2="313" y2="273" />
      <line x1="304" y1="168" x2="313" y2="159" />
      <line x1="208" y1="264" x2="199" y2="273" />
    </g>
  </g>

  <!-- 6. Đường sóng nhịp tim & điều hòa cảm giác (Heart / Calm Pulse) -->
  <path d="M 152 342 L 206 342 L 224 316 L 244 366 L 264 326 L 278 342 L 360 342" 
        fill="none" 
        stroke="url(#pulseGrad)" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
        
  <!-- Chấm tín hiệu nhịp đập cảm giác thời gian thực -->
  <circle cx="244" cy="366" r="6" fill="#f43f5e" />
</svg>